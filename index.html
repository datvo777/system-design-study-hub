const SEED_CARDS = [
  { id: 'c01', week: 7, title: 'Strong vs Eventual Consistency', def: 'Strong: mọi lần đọc thấy lần ghi mới nhất. Eventual: các bản sao sẽ hội tụ, trong một khoảng có thể đọc dữ liệu cũ.', a: 'Sai một lần là mất tiền hoặc vi phạm ràng buộc (số dư, tồn kho, lock). Mất: latency cao hơn, giảm availability khi có partition.', b: 'Đọc dữ liệu cũ vài giây vẫn chấp nhận được (like, feed, view count). Mất: phải xử lý conflict và UX đọc lại dữ liệu cũ.', real: 'Spanner, etcd (strong); DynamoDB mặc định, Cassandra, DNS (eventual).', line: 'Mình tách theo từng loại dữ liệu: số dư cần strong, còn số like thì eventual là đủ và rẻ hơn nhiều.' },
  { id: 'c02', week: 7, title: 'Latency vs Throughput', def: 'Latency là thời gian xử lý một request; throughput là số request xử lý được mỗi giây.', a: 'Tối ưu latency cho luồng user đang chờ (checkout, search). Mất: tài nguyên dư, ít batching.', b: 'Tối ưu throughput cho job nền, ingestion, analytics bằng batching, nén, pipeline. Mất: từng item chờ lâu hơn.', real: 'Kafka producer `linger.ms` / `batch.size`; Nagle algorithm của TCP.', line: 'Luồng ghi log mình bật batching để tăng throughput, chấp nhận thêm vài chục ms vì không user nào chờ nó.' },
  { id: 'c03', week: 7, title: 'ACID vs BASE', def: 'ACID: transaction nguyên tử, nhất quán, cô lập, bền. BASE: basically available, soft state, eventual consistency.', a: 'Tiền, đơn hàng, ledger. Mất: khó scale ngang, transaction phân tán đắt.', b: 'Dữ liệu khối lượng lớn chấp nhận lệch tạm thời. Mất: logic bù trừ và đối soát dồn lên tầng app.', real: 'Postgres, MySQL InnoDB (ACID); Cassandra, DynamoDB (BASE).', line: 'Ledger nằm trong DB ACID; các read model và counter xung quanh có thể BASE.' },
  { id: 'c04', week: 7, title: 'Read-through vs Write-through', def: 'Read-through: cache tự nạp từ DB khi miss. Write-through: ghi cache và DB đồng bộ trong cùng thao tác.', a: 'Đọc nhiều, muốn code app đơn giản. Mất: lần đọc đầu chậm, có thể stale nếu DB bị đổi từ bên ngoài.', b: 'Cần cache khớp DB ngay sau ghi. Mất: latency ghi tăng, cache chứa cả dữ liệu ít ai đọc.', real: 'Caffeine LoadingCache, DAX trước DynamoDB.', line: 'Mặc định mình dùng cache-aside + TTL ngắn; write-through chỉ cho dữ liệu vừa ghi là đọc lại ngay như profile.' },
  { id: 'c05', week: 7, title: 'Batch vs Stream Processing', def: 'Batch xử lý tập dữ liệu lớn theo lô định kỳ; stream xử lý từng sự kiện ngay khi tới.', a: 'Cần kết quả chính xác trên tập lớn, không gấp (báo cáo, đối soát cuối ngày). Mất: trễ từ giờ tới ngày.', b: 'Cần phản ứng trong giây (fraud, alert, dashboard realtime). Mất: phức tạp về state, window, late event, exactly-once.', real: 'Spark, Hadoop (batch); Kafka Streams, Flink (stream).', line: 'Fraud check chạy stream trong vài giây, còn reconciliation chạy batch cuối ngày làm chốt chặn đúng sai.' },
  { id: 'c06', week: 7, title: 'Load Balancer vs API Gateway', def: 'LB chia tải giữa các instance cùng loại; gateway là cửa vào xử lý routing theo API, auth, rate limit, transform.', a: 'Một service nhiều instance, không cần chính sách API. Mất: không có auth và quota tập trung.', b: 'Nhiều service, nhiều loại client, cần policy thống nhất. Mất: thêm một hop, có thể thành bottleneck.', real: 'AWS ALB, Nginx (LB); Kong, IBM API Connect, AWS API Gateway.', line: 'Thực tế dùng cả hai: LB phía trước, gateway ngay sau để áp auth và quota, rồi mỗi service lại có LB nội bộ.' },
  { id: 'c07', week: 8, title: 'API Gateway vs Direct Exposure', def: 'Đi qua gateway tập trung, hay client/service gọi thẳng vào service đích.', a: 'Client bên ngoài: bảo mật, versioning, rate limit, gom API. Mất: thêm latency, SPOF nếu không HA.', b: 'Service nội bộ trong mesh cần latency thấp. Mất: mỗi service tự lo auth; observability phải đến từ mesh.', real: 'Gateway ở edge (Zuul, Kong); gRPC east-west qua Istio.', line: 'North-south đi qua gateway, east-west gọi thẳng qua service mesh có mTLS.' },
  { id: 'c08', week: 8, title: 'Forward Proxy vs Reverse Proxy', def: 'Forward proxy đứng phía client, đại diện client đi ra ngoài; reverse proxy đứng phía server, đại diện server nhận request.', a: 'Cần kiểm soát hoặc ẩn traffic đi ra (lọc web công ty, egress proxy). Mất: thêm điểm cấu hình phía client.', b: 'Cần TLS termination, cache, LB, che giấu backend. Mất: thêm hop, phải HA.', real: 'Squid (forward); Nginx, Envoy, DataPower (reverse).', line: 'Gọi PSP bên ngoài qua egress proxy để có IP cố định cho whitelist; traffic vào đi qua reverse proxy.' },
  { id: 'c09', week: 8, title: 'SQL vs NoSQL', def: 'SQL: schema quan hệ, join, transaction nhiều bảng. NoSQL: mô hình key-value, document, wide-column, graph tối ưu cho access pattern cụ thể.', a: 'Quan hệ phức tạp, cần join và transaction nhiều bảng. Mất: scale ghi ngang khó, sharding thủ công.', b: 'Access pattern biết trước theo key, ghi cực lớn, scale ngang. Mất: không join, transaction hạn chế, phải denormalize theo query.', real: 'Postgres cho đơn hàng; Cassandra/ScyllaDB cho tin nhắn của Discord; DynamoDB cho giỏ hàng.', line: 'Mình chọn theo access pattern: lịch sử chat đọc theo conversation_id và thời gian nên wide-column hợp hơn bảng quan hệ.' },
  { id: 'c10', week: 8, title: 'Primary-Replica vs Peer-to-Peer Replication', def: 'Primary-replica: một node nhận ghi rồi sao chép đi. Peer-to-peer: nhiều node cùng nhận ghi (multi-leader, leaderless).', a: 'Cần thứ tự ghi đơn giản, tránh conflict. Mất: primary là nút cổ chai ghi, failover cần leader election.', b: 'Cần ghi ở nhiều nơi, chịu lỗi cao. Mất: phải giải conflict (LWW, vector clock, CRDT).', real: 'Postgres streaming replication; Cassandra, DynamoDB.', line: 'Dữ liệu tiền mình giữ một leader; giỏ hàng nhiều region thì chấp nhận multi-leader và merge.' },
  { id: 'c11', week: 8, title: 'Data Compression vs Data Deduplication', def: 'Nén giảm kích thước một khối dữ liệu; dedup tránh lưu lại các khối giống hệt nhau.', a: 'Dữ liệu lặp bên trong một file hoặc stream (log, JSON). Mất: CPU khi nén và giải nén.', b: 'Nhiều file hoặc phiên bản dùng chung chunk (backup, Dropbox). Mất: index hash, chunking phức tạp, reference count khi xoá.', real: 'zstd/gzip trên Kafka; Dropbox chia chunk theo hash.', line: 'Google Drive mình dedup theo chunk hash ngay ở client, rồi nén từng chunk khi truyền.' },
  { id: 'c12', week: 8, title: 'Server-side vs Client-side Caching', def: 'Cache ở phía hạ tầng (Redis, CDN) hay ở phía client (browser, app, HTTP cache).', a: 'Nhiều user dùng chung dữ liệu, cần invalidate tập trung. Mất: vẫn tốn một round trip mạng.', b: 'Dữ liệu ít đổi, theo từng user. Mất: khó invalidate, dữ liệu cũ nằm trên máy client.', real: 'Redis cluster; HTTP `ETag` + 304; cache offline của app mobile.', line: 'Static asset có hash trong tên file cache 1 năm ở client; dữ liệu động dùng ETag để chỉ tải lại khi đổi.' },
  { id: 'c13', week: 8, title: 'REST vs gRPC', def: 'REST: resource qua HTTP + JSON. gRPC: RPC qua HTTP/2 + Protobuf, có contract và streaming.', a: 'API công khai, browser, dễ debug, cache HTTP tốt. Mất: payload lớn hơn, contract lỏng.', b: 'Service nội bộ cần latency thấp, streaming, contract chặt. Mất: browser cần gRPC-Web, khó debug bằng curl.', real: 'Stripe API (REST); service nội bộ của Google, Netflix (gRPC).', line: 'Ngoài edge mình expose REST, bên trong các service nói chuyện bằng gRPC để có schema và streaming.' },
  { id: 'c14', week: 9, title: 'Polling vs Long Polling vs Webhooks', def: 'Polling hỏi định kỳ; long polling giữ request tới khi có dữ liệu; webhook là bên kia chủ động gọi URL của mình khi có sự kiện.', a: 'Polling / long polling khi mình không có endpoint public hoặc bên kia không hỗ trợ push. Mất: request rỗng, trễ theo chu kỳ.', b: 'Webhook khi tích hợp server-server, sự kiện thưa. Mất: phải kiểm chữ ký HMAC, retry, idempotency, xử lý webhook bị mất.', real: 'Stripe, GitHub webhooks; long polling của Amazon SQS.', line: 'Webhook là đường chính, nhưng luôn có job polling các giao dịch PENDING để bắt webhook bị mất.' },
  { id: 'c15', week: 9, title: 'CDN vs Direct Server Serving', def: 'Phục vụ nội dung từ edge gần user, hay trực tiếp từ origin.', a: 'Nội dung tĩnh hoặc ít đổi, user phân tán toàn cầu. Mất: chi phí, invalidation chậm, khó với nội dung riêng tư.', b: 'Nội dung động, cá nhân hoá, user tập trung một vùng. Mất: latency xa, origin chịu toàn bộ băng thông.', real: 'Netflix Open Connect, Cloudflare; API cá nhân hoá từ origin.', line: 'Video và thumbnail qua CDN; API danh sách gợi ý cá nhân đi thẳng origin.' },
  { id: 'c16', week: 9, title: 'Serverless vs Server-based', def: 'Chạy hàm theo sự kiện, trả tiền theo lần gọi; hay chạy service lâu dài trên VM/container.', a: 'Tải thất thường, job ngắn, event-driven (transcode, resize ảnh). Mất: cold start, giới hạn thời gian chạy, khó giữ kết nối DB.', b: 'Tải ổn định, nhạy latency, kết nối dài (WebSocket). Mất: trả tiền cả khi idle, tự lo scaling.', real: 'AWS Lambda resize ảnh S3; chat gateway chạy trên Kubernetes/OpenShift.', line: 'Tải đều và cao thì server-based rẻ hơn; serverless thắng khi tải là các đỉnh ngắn và thưa.' },
  { id: 'c17', week: 9, title: 'Hybrid Cloud vs All-Cloud Storage', def: 'Giữ một phần dữ liệu on-prem và một phần trên cloud, hay đưa hết lên cloud.', a: 'Có yêu cầu data residency, dữ liệu nhạy cảm, chi phí egress lớn. Mất: vận hành hai môi trường, đồng bộ phức tạp.', b: 'Muốn đơn giản, co giãn nhanh, dùng managed service. Mất: phụ thuộc vendor, chi phí egress và lưu trữ dài hạn.', real: 'Ngân hàng giữ core banking on-prem, analytics trên cloud; Dropbox chuyển từ S3 về hạ tầng riêng (Magic Pocket).', line: 'Dữ liệu bị luật giữ trong nước để bản gốc on-prem, chỉ đẩy dữ liệu đã ẩn danh lên cloud.' },
  { id: 'c18', week: 9, title: 'Token Bucket vs Leaky Bucket', def: 'Token bucket nạp token đều, cho phép xài dồn tới dung lượng bucket; leaky bucket xả request ra với tốc độ cố định.', a: 'Cho phép burst hợp lệ (mở app gọi 10 API cùng lúc). Mất: downstream vẫn phải chịu burst.', b: 'Downstream cần tốc độ đều (gọi PSP, gửi SMS). Mất: burst bị xếp hàng hoặc drop, latency tăng.', real: 'AWS API Gateway, Stripe (token bucket); Nginx `limit_req` (leaky bucket).', line: 'Ở gateway mình cho burst bằng token bucket, còn hàng gửi SMS tới nhà mạng thì xả đều bằng leaky bucket.' },
  { id: 'c19', week: 9, title: 'Read-heavy vs Write-heavy System', def: 'Thiết kế tối ưu cho đường đọc hay cho đường ghi, xuất phát từ tỷ lệ đọc:ghi.', a: 'Read-heavy: cache nhiều tầng, read replica, CDN, denormalize. Mất: invalidation, dữ liệu cũ.', b: 'Write-heavy: queue hấp thụ tải, batch / write-behind, LSM-tree, shard theo hash. Mất: đọc chậm hơn, consistency yếu hơn.', real: 'TinyURL, news feed (read-heavy); metrics, log, location update của Uber (write-heavy).', line: 'Mình xác định tỷ lệ đọc ghi đầu tiên vì nó quyết định gần như mọi lựa chọn storage phía sau.' },
  { id: 'c20', week: 10, title: 'Saga Orchestration vs Choreography', def: 'Orchestration: một bộ điều phối gọi từng bước. Choreography: các service phản ứng với event của nhau.', a: 'Nhiều bước, cần thấy trạng thái tập trung, dễ debug. Mất: orchestrator chứa nhiều logic và thành điểm phụ thuộc.', b: 'Ít bước, các service độc lập, muốn ghép lỏng. Mất: khó theo dõi luồng tổng, dễ thành chuỗi event rối.', real: 'Temporal, Camunda, App Connect (orchestration); chuỗi event Kafka (choreography).', line: 'Từ 3–4 bước trở lên mình chọn orchestration để có một chỗ thấy trạng thái và chạy bù trừ.' },
  { id: 'c21', week: 10, title: 'TCC vs 2PC vs Saga', def: '2PC khoá tài nguyên qua prepare/commit; TCC giữ chỗ ở tầng nghiệp vụ (Try) rồi Confirm/Cancel; Saga chạy các bước local và bù trừ khi lỗi.', a: '2PC khi các bên cùng hỗ trợ XA và cần atomic thật. Mất: block khi coordinator chết, throughput thấp.', b: 'TCC khi phải giữ tài nguyên ngay (giữ tiền, giữ vé); Saga khi chấp nhận trạng thái trung gian và bù trừ sau. Mất: TCC cần 3 API mỗi bước, Saga lộ trạng thái trung gian.', real: 'XA trong JTA (2PC); Seata TCC; Saga đặt vé máy bay + khách sạn.', line: 'Trừ tiền ví mình dùng TCC để giữ tiền ở bước Try; gửi email, cộng điểm thì Saga là đủ.' },
  { id: 'c22', week: 4, title: 'Pessimistic vs Optimistic Locking', def: 'Pessimistic khoá dòng trước khi sửa (`SELECT ... FOR UPDATE`); optimistic kiểm tra version lúc ghi và retry khi lệch.', a: 'Tranh chấp cao trên cùng một dòng. Mất: chờ lock, nguy cơ deadlock, giảm song song.', b: 'Tranh chấp thấp. Mất: bão retry khi tranh chấp cao.', real: 'Trừ số dư merchant lớn (pessimistic); sửa profile, giỏ hàng với JPA `@Version` (optimistic).', line: 'Mình đo contention: tài khoản merchant nóng dùng FOR UPDATE, tài khoản user thường dùng @Version.' },
  { id: 'c23', week: 4, title: 'B-Tree vs LSM-Tree', def: 'B-tree cập nhật trang tại chỗ; LSM-tree ghi tuần tự vào memtable rồi flush thành SSTable và compaction.', a: 'Đọc nhiều, cần range query và update tại chỗ. Mất: ghi ngẫu nhiên, write amplification.', b: 'Ghi cực lớn, ghi tuần tự. Mất: đọc phải xem nhiều SSTable (cần Bloom filter), compaction tốn I/O.', real: 'Postgres, MySQL InnoDB (B-tree); Cassandra, RocksDB, ScyllaDB (LSM).', line: 'Location update của Uber là write-heavy nên mình chọn store LSM, kèm Bloom filter để đọc không quá chậm.' },
  { id: 'c24', week: 11, title: 'Geohash vs Quadtree vs H3', def: 'Geohash mã hoá toạ độ thành chuỗi theo ô chữ nhật; quadtree chia không gian theo mật độ; H3 chia thế giới thành ô lục giác.', a: 'Geohash khi muốn index đơn giản bằng prefix trong Redis/DB. Mất: ô méo ở vĩ độ cao, phải query 9 ô.', b: 'Quadtree khi mật độ chênh lệch lớn; H3 khi cần khoảng cách đều giữa ô láng giềng cho dispatch, pricing. Mất: quadtree phải dựng trong memory, H3 cần thư viện riêng.', real: 'Redis GEO (geohash); Uber H3; quadtree trong các proximity service kiểu Yelp.', line: 'Mình bắt đầu bằng geohash trong Redis; khi cần surge pricing theo vùng đều nhau thì chuyển sang H3.' },
  { id: 'c25', week: 14, title: 'Fan-out on Write vs Fan-out on Read', def: 'Push bài mới vào feed của từng follower lúc ghi, hay gom bài từ những người mình follow lúc đọc.', a: 'Đa số user ít follower, cần đọc feed nhanh. Mất: write amplification với celebrity.', b: 'Tài khoản rất nhiều follower. Mất: đọc chậm vì phải gom và merge lúc mở app.', real: 'Twitter / X và Instagram dùng mô hình lai.', line: 'Mình dùng lai: push cho user thường, pull cho celebrity, merge khi đọc.' },
  { id: 'c26', week: 3, title: 'At-least-once vs Exactly-once', def: 'At-least-once: message có thể tới nhiều lần nhưng không mất. Exactly-once: mỗi message có hiệu lực đúng một lần.', a: 'At-least-once + consumer idempotent cho đa số hệ thống. Mất: phải dedup ở nơi ghi.', b: 'Exactly-once (Kafka transactions) khi pipeline nằm gọn trong Kafka. Mất: throughput giảm, chỉ đúng trong biên Kafka.', real: 'IBM MQ persistent + syncpoint; Kafka EOS cho Kafka Streams.', line: 'Exactly-once end-to-end gần như không có; mình làm at-least-once và idempotent ở chỗ ghi cuối.' },
  { id: 'c27', week: 2, title: 'Sticky Session vs Stateless + Shared Store', def: 'Gắn user vào một instance cố định, hay để mọi instance như nhau và đẩy state ra store chung.', a: 'Sticky khi state nằm trong memory và cần đơn giản trước mắt. Mất: lệch tải, mất session khi node chết.', b: 'Stateless + Redis khi cần autoscale tự do. Mất: thêm round trip, Redis phải HA.', real: 'WebSocket gateway giữ kết nối nhưng state phiên đặt trong Redis.', line: 'Kết nối WebSocket buộc phải gắn node, nhưng state phiên mình vẫn để ở Redis để node chết thì client nối lại node khác được.' }
];

function splitItems(text) {
  if (!text) return [];
  const out = []; let depth = 0, cur = '';
  for (const ch of text) {
    if (ch === '(' || ch === '[') depth++;
    else if (ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
    if (ch === ';' && depth === 0) { if (cur.trim()) out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out.map(s => s.replace(/\.$/, ''));
}
const WM = WEEKS.map(w => {
  const mk = (sec, txt) => splitItems(txt).map((t, i) => ({ id: `w${w.n}-${sec}-${i}`, text: t }));
  const learn = w.learn.map((g, gi) => ({ label: g.label, items: splitItems(g.text).map((t, i) => ({ id: `w${w.n}-learn-${gi}-${i}`, text: t })) }));
  const read = mk('read', w.read), lab = mk('do', w.do), out = mk('out', w.out);
  const all = [...learn.flatMap(g => g.items), ...read, ...lab, ...out];
  return Object.assign({}, w, { learn, read, lab, out, all, phase: phaseOf(w.n) });
});
const TOTAL_ITEMS = WM.reduce((a, w) => a + w.all.length, 0);

  const r = raw && typeof raw === 'object' ? raw : {};
  const obj = (k) => Object.assign({}, d[k], r[k] && typeof r[k] === 'object' && !Array.isArray(r[k]) ? r[k] : {});
  return Object.assign({}, d, r, {
    checks: obj('checks'), quiz: obj('quiz'), links: obj('links'), rhythm: obj('rhythm'),

    }),
    history: Array.isArray(r.history) ? r.history : [], cards: Array.isArray(r.cards) ? r.cards : [], gaps: Array.isArray(r.gaps) ? r.gaps : []
  });
}
function loadState() {

function setIn(o, p, v) {
  if (!p.length) return v;
  const [k, ...rest] = p;
  const base = o == null ? (typeof k === 'number' ? [] : {}) : o;
  const c = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  c[k] = setIn(base[k], rest, v);
  return c;
}
const getIn = (o, p) => p.reduce((a, k) => (a == null ? undefined : a[k]), o);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const fmt = (x, d = 1) => (Number.isFinite(x) ? x.toLocaleString('vi-VN', { maximumFractionDigits: d }) : '—');
function fmtBytes(b) {
  if (!Number.isFinite(b)) return '—';
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB']; let i = 0;
  while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; }
  return fmt(b, b < 10 ? 2 : 1) + ' ' + u[i];
}
function isoWeekKey(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${String(w).padStart(2, '0')}`;
}
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function computeStats(checks) {
  const week = {}; let done = 0, hours = 0;
  WM.forEach(w => {
    const d = w.all.filter(i => checks[i.id]).length;
    week[w.n] = { done: d, total: w.all.length };
    done += d; hours += w.all.length ? (d / w.all.length) * 11 : 0;
  });
  const phase = {};
  PHASES.forEach(p => {
    const t = p.weeks.reduce((a, n) => a + week[n].total, 0), d = p.weeks.reduce((a, n) => a + week[n].done, 0);
    phase[p.id] = { done: d, total: t };
  });
  return { week, phase, done, total: TOTAL_ITEMS, pct: TOTAL_ITEMS ? done / TOTAL_ITEMS : 0, hours };
}

/* Inline text: `code` và **bold** */
function Inline({ text }) {
  const parts = String(text || '').split(/(`[^`]+`|\*\*[^*]+\*\*)/g).filter(Boolean);
  return parts.map((p, i) => {
    if (p.startsWith('`') && p.endsWith('`')) return html`<code key=${i} className="inl">${p.slice(1, -1)}</code>`;
    if (p.startsWith('**') && p.endsWith('**')) return html`<strong key=${i} className="font-semibold text-slate-100">${p.slice(2, -2)}</strong>`;
    return html`<${React.Fragment} key=${i}>${p}<//>`;
  });
}

/* =========================================================
   LESSONS: markdown per week in lessons/wN.md, one section per concept, delimited by "@@ <item id>"
   ========================================================= */
const LESSON_WEEKS = [1, 2, 3, 4];
const hasLesson = n => LESSON_WEEKS.includes(n);
const lessonWeek = id => { const m = /^w(\d+)-learn-/.exec(id || ''); const n = m ? Number(m[1]) : 0; return hasLesson(n) ? n : 0; };
const lessonCache = {};
function parseLessons(txt) {
  const map = {}; let id = null, buf = [];
  for (const line of String(txt).split('\n')) {
    const m = /^@@\s+(w\d+-learn-\d+-\d+)\s*$/.exec(line);
    if (m) { if (id) map[id] = buf.join('\n'); id = m[1]; buf = []; } else if (id) buf.push(line);
  }
  if (id) map[id] = buf.join('\n');
  return map;
}
function loadLessons(n) {
  if (!lessonCache[n]) {
    lessonCache[n] = fetch('lessons/w' + n + '.md', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(parseLessons)
      .catch(e => { delete lessonCache[n]; throw e; });
  }
  return lessonCache[n];
}
function renderMd(md) {
  try { if (window.marked) return window.marked.parse(md, { gfm: true }); } catch (e) { }
  return '<pre>' + String(md).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) + '</pre>';
}
function LessonReader({ S, set, id, onClose }) {

  const [st, setSt] = useState({ status: 'loading', html: '' });
  const scroller = useRef(null);
  const go = d => { const n = items[idx + d]; if (n) set(['ui', 'lesson'], n.id); };
  useEffect(() => {
    let live = true; setSt({ status: 'loading', html: '' });
    loadLessons(wn).then(map => { if (!live) return; const md = map[item.id]; setSt(md ? { status: 'ok', html: renderMd(md) } : { status: 'missing', html: '' }); })
      .catch(e => { if (live) setSt({ status: 'error', html: String(e && e.message || e) }); });
    if (scroller.current) scroller.current.scrollTop = 0;
    return () => { live = false; };
  }, [item.id, wn]);
  useEffect(() => {
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    const onKey = e => {

  const done = !!S.checks[item.id];

  return html`<div className="fixed inset-0 z-50 flex flex-col bg-slate-950" role="dialog" aria-modal="true" aria-label=${'Bài học: ' + item.text}>

          className=${'flex w-full items-start gap-2 rounded-md px-2 py-2 text-left text-[13px] leading-snug ' + (i === idx ? 'bg-indigo-500/15 text-slate-50' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200')}>

          <span className="min-w-0"><${Inline} text=${it.text} /></span></button>`)}
      </nav>
      <div ref=${scroller} className="min-w-0 flex-1 overflow-y-auto">
        <div className="gutter mx-auto max-w-3xl py-6 sm:py-8">

function HikariCalc({ S, set }) {
  const h = S.hikari;
  const n = k => Math.max(0, Number(h[k]) || 0);
  const pods = n('pods'), pool = n('pool'), maxC = n('maxConn'), cores = n('cores'), sp = n('spindle');
  const total = pods * pool;
  const reserved = 3; // superuser_reserved_connections mặc định
  const usable = Math.max(0, maxC - reserved);
  const ideal = cores * 2 + sp;
  const maxPerPod = pods ? Math.floor(usable / pods) : 0;
  const idealPerPod = pods ? Math.floor(ideal / pods) : 0;
  const ratio = usable ? total / usable : Infinity;
  const level = total > usable ? 'bad' : ratio > 0.8 ? 'warn' : 'ok';
  const tone = { bad: 'border-rose-500/50 bg-rose-500/10 text-rose-200', warn: 'border-amber-500/50 bg-amber-500/10 text-amber-200', ok: 'border-emerald-500/50 bg-emerald-500/10 text-emerald-200' }[level];
  const field = (k, label, hint) => html`<label className="flex flex-col gap-1 text-xs text-slate-400" htmlFor=${'hk-' + k}>${label}
    <input id=${'hk-' + k} type="number" min="0" inputMode="numeric" className=${inputCls + ' tnum'} value=${h[k]} onChange=${e => set(['hikari', k], e.target.value)} />
    ${hint ? html`<span className="text-[11px] text-slate-600">${hint}</span>` : null}</label>`;
  return html`<section className=${panel + ' p-4'}>
    <div className="mb-1 flex items-center gap-2"><${Icon} n="calc" className="text-indigo-400" /><h3 className="text-sm font-semibold text-slate-100">HikariCP & Postgres connection calculator</h3></div>
    <p className="mb-3 text-xs text-slate-500">Mặc định là ví dụ trong plan: 50 pod × pool 20 vào một Postgres để <code className="inl">max_connections = 100</code>.</p>
    <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
      ${field('pods', 'Số pod')}${field('pool', 'maxPoolSize mỗi pod')}${field('maxConn', 'Postgres max_connections')}
      ${field('cores', 'Số core của DB server', 'core_count')}${field('spindle', 'effective_spindle_count', 'SSD thường để 1')}
    </div>
    <div className=${'mt-3 rounded-lg border p-3 ' + tone}>
      <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1"><span className="tnum text-2xl font-semibold">${fmt(total, 0)}</span><span className="text-sm">kết nối = ${fmt(pods, 0)} pod × ${fmt(pool, 0)}</span>
        <span className="tnum ml-auto text-sm">dùng được ${fmt(usable, 0)} (${fmt(maxC, 0)} − ${reserved} dành cho superuser)</span></div>
      <p className="mt-1 text-sm">${level === 'bad' ? `Vượt ${fmt(total - usable, 0)} kết nối: pod mới sẽ lỗi "too many clients" khi scale.` : level === 'warn' ? 'Sát ngưỡng (trên 80%): một đợt rolling deploy tạo pod mới song song là vượt.' : 'An toàn, còn dư cho rolling deploy và công cụ admin.'}</p>
    </div>
    <div className="mt-3 grid grid-cols-1 gap-2 text-sm sm:grid-cols-2">
      <div className="rounded-lg border border-slate-800 bg-slate-950/60 p-3"><${Eyebrow}>Pool tối đa mỗi pod<//><div className="tnum mt-1 text-lg text-slate-100">${fmt(maxPerPod, 0)}</div><div className="text-xs text-slate-500">⌊${fmt(usable, 0)} ÷ ${fmt(pods, 0)}⌋ để không vượt max_connections</div></div>
      <div className="rounded-lg border border-slate-800 bg-slate-950/60 p-3"><${Eyebrow}>Tổng lý tưởng cho DB<//><div className="tnum mt-1 text-lg text-slate-100">${fmt(ideal, 0)}</div><div className="text-xs text-slate-500">(core_count × 2) + spindle = (${cores} × 2) + ${sp}</div></div>
    </div>
    <p className="mt-3 text-xs leading-relaxed text-slate-400">Công thức của HikariCP là số kết nối <em>tổng</em> mà DB xử lý tốt, không phải cho từng pod. Chia cho ${fmt(pods, 0)} pod thì mỗi pod được ${fmt(idealPerPod, 0)}. ${idealPerPod < 2 ? 'Quá ít: đặt PgBouncer (transaction pooling) giữa app và Postgres, để mỗi pod giữ pool nhỏ tới PgBouncer còn PgBouncer giữ khoảng ' + fmt(ideal, 0) + ' kết nối thật tới DB.' : 'Đặt maxPoolSize mỗi pod quanh con số này và theo dõi thời gian chờ lấy connection.'}</p>
  </section>`;
}

function MockStudio({ S, set }) {
  const m = S.mock;
  const dur = m.duration === 60 ? 60 : 45;
  const mins = STEP_MIN[dur];
  const bounds = mins.reduce((acc, x) => { acc.push((acc.length ? acc[acc.length - 1] : 0) + x * 60); return acc; }, []);
  const total = bounds[bounds.length - 1];
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const startRef = useRef(0);
  const [openId, setOpenId] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [savedMsg, setSavedMsg] = useState('');

  useEffect(() => {
    if (!running) return;
    startRef.current = Date.now() - elapsed * 1000;
    const t = setInterval(() => setElapsed(Math.floor((Date.now() - startRef.current) / 1000)), 250);
    return () => clearInterval(t);
  }, [running]);

  const stepIdx = Math.min(bounds.findIndex(b => elapsed < b) === -1 ? 6 : bounds.findIndex(b => elapsed < b), 6);
  const stepStart = stepIdx ? bounds[stepIdx - 1] : 0;
  const stepLeft = bounds[stepIdx] - elapsed;
  const over = elapsed >= total;
  const mmss = s => { const a = Math.abs(s); return (s < 0 ? '−' : '') + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0'); };
  const jump = i => { const at = i ? bounds[i - 1] : 0; setElapsed(at); startRef.current = Date.now() - at * 1000; };
  const score = m.scores.reduce((a, b) => a + (b || 0), 0);
  const canSave = m.problem && (m.sections.some(s => s.trim()) || score > 0);

  const save = () => {
    const entry = { id: uid(), date: new Date().toISOString(), problem: m.problem, duration: dur, elapsed, scores: m.scores.slice(), sections: m.sections.slice() };
    set(['history'], h => [entry, ...(h || [])]);
    set(['mock'], Object.assign({}, m, { sections: ['', '', '', '', '', '', ''], scores: [0, 0, 0, 0, 0] }));
    setRunning(false); setElapsed(0);
    setSavedMsg('Đã lưu bài "' + m.problem + '" vào lịch sử.');
    setTimeout(() => setSavedMsg(''), 3500);
  };

  return html`<div className="flex flex-col gap-5">
    <section className="flex flex-col gap-1">
      <h1 className="text-2xl font-semibold text-slate-50">Phòng luyện đề ${dur} phút</h1>
      <p className="prose-line text-sm text-slate-400">Bấm giờ theo khung 7 bước, nói to, gõ design doc 1 trang ngay bên cạnh. Xong thì tự chấm theo rubric và lưu lại.</p>
    </section>
    <div className="grid grid-cols-1 gap-4 xl:grid-cols-[minmax(0,380px)_minmax(0,1fr)]">
      <div className="flex flex-col gap-4 xl:sticky xl:top-20 xl:self-start">
        <section className=${panel + ' p-4'}>
          <div className="flex items-center justify-between gap-2">
            <div className="flex rounded-md border border-slate-800 p-0.5" role="group" aria-label="Thời lượng">
              ${[45, 60].map(d => html`<button key=${d} onClick=${() => { set(['mock', 'duration'], d); setRunning(false); setElapsed(0); }} className=${`tnum rounded px-3 py-1 text-xs font-medium ${dur === d ? 'bg-slate-700 text-slate-50' : 'text-slate-400 hover:text-slate-200'}`}>${d} phút</button>`)}
            </div>
            <span className=${'tnum text-xs ' + (over ? 'text-rose-400' : 'text-slate-500')}>${over ? 'Hết giờ' : 'Bước ' + (stepIdx + 1) + '/7'}</span>
          </div>

/* =========================================================

function getAllCards(S) {
  const seed = SEED_CARDS.map(c => Object.assign({}, c, S.cardEdits[c.id] || {}, { seed: true }));
  return [...seed, ...(S.cards || [])];
}
const abNames = title => { const p = String(title).split(/\s+vs\.?\s+/i); return [p[0] || 'A', p.slice(1).join(' / ') || 'B']; };
function CardBody({ c }) {
  const [an, bn] = abNames(c.title);

  return html`<div className="flex flex-col gap-3">
    ${row('Định nghĩa ngắn', c.def)}
    ${row('Chọn ' + an + ' khi', c.a)}

    ${row('Hệ thống thực tế', c.real, 'text-slate-400')}
    <div className="rounded-md border border-emerald-500/30 bg-emerald-500/5 p-3"><div className="text-[11px] font-semibold uppercase tracking-wider text-emerald-400">Câu chốt trong phòng phỏng vấn</div><div className="mt-1 text-sm italic leading-relaxed text-emerald-100">"${c.line}"</div></div>
  </div>`;
}
function CardEditor({ card, onSave, onClose }) {

    ${rows ? html`<textarea id=${'ce-' + k} rows=${rows} className=${inputCls + ' resize-y'} value=${f[k]} onChange=${e => setF(Object.assign({}, f, { [k]: e.target.value }))}></textarea>`

    <form className="flex flex-col gap-3" onSubmit=${e => { e.preventDefault(); if (f.title.trim()) onSave(f); }}>

        <label className="flex flex-col gap-1 text-xs text-slate-400" htmlFor="ce-week">Tuần<select id="ce-week" className=${inputCls} value=${f.week} onChange=${e => setF(Object.assign({}, f, { week: Number(e.target.value) }))}>${WEEKS.map(w => html`<option key=${w.n} value=${w.n}>Tuần ${w.n}</option>`)}</select></label></div>
      ${fld('def', 'Định nghĩa ngắn', 2)}${fld('a', 'Chọn A khi nào (và mất gì)', 2)}${fld('b', 'Chọn B khi nào (và mất gì)', 2)}${fld('real', 'Hệ thống thực tế sử dụng', 2)}${fld('line', 'Một câu chốt ăn điểm', 2)}
      <div className="flex justify-end gap-2 pt-1"><button type="button" className=${B('ghost')} onClick=${onClose}>Huỷ</button><button type="submit" className=${B('primary')} disabled=${!f.title.trim()}>Lưu thẻ</button></div>
    </form><//>`;

function QuizMode({ deck, S, set, onClose }) {
  const [i, setI] = useState(0);

  const [flip, setFlip] = useState(false);
  const [res, setRes] = useState({});

  useEffect(() => { if (flip || !c) return; if (left <= 0) { setFlip(true); return; } const t = setTimeout(() => setLeft(l => l - 1), 1000); return () => clearTimeout(t); }, [left, flip, i]);
  const mark = st => { set(['cardStatus', c.id], st); setRes(r => Object.assign({}, r, { [c.id]: st })); setI(x => x + 1); setLeft(60); setFlip(false); };
  if (!c) {
    const k = Object.values(res).filter(v => v === 'known').length;
    return html`<${Modal} title="Kết quả quiz 60 giây" onClose=${onClose}>
      <div className="text-center"><div className="tnum text-5xl font-semibold text-slate-50">${k}<span className="text-2xl text-slate-500">/${deck.length}</span></div><p className="mt-2 text-sm text-slate-400">thẻ đã thuộc làu</p></div>
      <ul className="mt-4 flex flex-col gap-1">${deck.map(d => html`<li key=${d.id} className="flex items-center justify-between gap-3 rounded-md px-2 py-1.5 text-sm"><span className="text-slate-300">${d.title}</span><span className=${'text-xs ' + (res[d.id] === 'known' ? 'text-emerald-300' : 'text-amber-300')}>${res[d.id] === 'known' ? 'Đã thuộc' : 'Cần ôn'}</span></li>`)}</ul>
      <div className="mt-4 flex justify-end"><button className=${B('primary')} onClick=${onClose}>Xong</button></div><//>`;
  }
  return html`<${Modal} title=${'Random 60s quiz · thẻ ' + (i + 1) + '/' + deck.length} onClose=${onClose} wide=${true}>
    <div className="flex flex-col gap-4">
      <div className="flex items-center gap-3"><div className="flex-1"><${Bar} value=${left / 60} cls=${left > 20 ? 'bg-indigo-500' : 'bg-rose-500'} h="h-2" /></div><span className=${'tnum w-12 text-right text-lg font-semibold ' + (left > 20 ? 'text-slate-100' : 'text-rose-300')}>${flip ? '—' : left + 's'}</span></div>
      <div className="rounded-xl border border-slate-800 bg-slate-950 p-5 text-center">
        <div className="tnum text-xs text-slate-500">Tuần ${c.week}</div>
        <h3 className="mt-1 text-xl font-semibold text-slate-50 sm:text-2xl">${c.title}</h3>
        ${!flip ? html`<p className="mt-3 text-sm text-slate-400">Nói to: định nghĩa, chọn bên nào khi nào, mất gì, ví dụ thật, và câu chốt.</p>` : null}
      </div>

        <div className="grid grid-cols-2 gap-2"><button className=${B('warn')} onClick=${() => mark('review')}>Cần ôn lại</button><button className=${B('ok')} onClick=${() => mark('known')}><${Icon} n="check" />Đã thuộc làu</button></div>`
        : html`<button className=${B('primary') + ' py-3'} onClick=${() => setFlip(true)}>Lật thẻ xem đáp án</button>`}
    </div><//>`;
}
function Cards({ S, set }) {

  const st = c => S.cardStatus[c.id] || 'new';

  const shown = all.filter(c => (filter === 'all' || st(c) === filter) && (!q || (c.title + ' ' + c.def).toLowerCase().includes(q.toLowerCase())));
  const startQuiz = () => {
    const pool = all.slice().sort((a, b) => (st(a) === 'known') - (st(b) === 'known') || Math.random() - 0.5);
    const pick = pool.slice(0, Math.min(10, pool.length)).sort(() => Math.random() - 0.5);

    else if (editing && editing.id) set(['cards'], cs => cs.map(c => c.id === editing.id ? Object.assign({}, c, f) : c));

  return html`<div className="flex flex-col gap-5">
    <section className="flex flex-wrap items-end justify-between gap-3">

    </div>

      ${shown.map(c => html`<article key=${c.id} className=${panel + ' flex flex-col gap-4 p-4'}>

          ${!c.seed ? (delId === c.id ? html`<button className=${B('danger') + ' px-2 py-1 text-xs'} onClick=${() => { set(['cards'], cs => cs.filter(x => x.id !== c.id)); setDelId(null); }}>Xác nhận xoá</button>` : html`<button className=${B('quiet') + ' text-xs'} onClick=${() => setDelId(c.id)}><${Icon} n="trash" s=${14} />Xoá</button>`) : null}

function Cheat({ S, set }) {
  const c = S.calc;
  const n = k => Math.max(0, Number(c[k]) || 0);
  const users = n('dau') * 1e6;
  const rQ = users * n('read') / 86400, wQ = users * n('write') / 86400;
  const sum = rQ + wQ;
  const bwR = rQ * n('size'), bwW = wQ * n('size');
  const stor = users * n('write') * n('size') * 365 * n('years');
  const field = (k, label, extra) => html`<label className="flex flex-col gap-1 text-xs text-slate-400" htmlFor=${'calc-' + k}>${label}
    ${extra || html`<input id=${'calc-' + k} type="number" min="0" step="any" inputMode="decimal" className=${inputCls + ' tnum'} value=${c[k]} onChange=${e => set(['calc', k], e.target.value)} />`}</label>`;
  const out = (label, value, formula, accent) => html`<div className="rounded-lg border border-slate-800 bg-slate-950/60 p-3 min-w-0">
    <${Eyebrow}>${label}<//><div className=${'tnum mt-1 text-xl font-semibold ' + (accent || 'text-slate-50')}>${value}</div><div className="tnum mt-1 break-words text-[11px] text-slate-500">${formula}</div></div>`;
  let grp = '';

function ExportModal({ S, onClose }) {
  const text = useMemo(() => JSON.stringify(Object.assign({}, S, { exportedAt: new Date().toISOString() }), null, 2), [S]);
  const ref = useRef(null);
  const [msg, setMsg] = useState('');
  const name = `sd-progress-${todayStr()}.json`;
  const copy = () => {
    const sel = () => { if (ref.current) { ref.current.focus(); ref.current.select(); } setMsg('Đã chọn toàn bộ JSON, nhấn Ctrl/Cmd + C để sao chép.'); };
    try { navigator.clipboard.writeText(text).then(() => setMsg('Đã sao chép JSON. Dán vào file ' + name + ' để lưu.'), sel); } catch (e) { sel(); }
  };
  const save = () => {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setMsg('Đã tạo file ' + name + '. Nếu trình duyệt không tải, hãy dùng nút Sao chép JSON.');
    } catch (e) { copy(); }
  };
  return html`<${Modal} title="Export JSON" onClose=${onClose} wide=${true}>
    <div className="flex flex-col gap-3">
      <p className="text-sm text-slate-400">Tải file <code className="inl">${name}</code> để backup hoặc chuyển sang máy khác. Nếu trình duyệt chặn tải file, hãy sao chép JSON rồi dán vào file đó.</p>
      <textarea id="export-json" ref=${ref} readOnly rows="12" className=${inputCls + ' tnum text-xs'} value=${text}></textarea>
      <div className="flex flex-wrap items-center gap-3"><button className=${B('primary')} onClick=${save}><${Icon} n="download" />Tải file JSON</button><button className=${B('ghost')} onClick=${copy}><${Icon} n="copy" />Sao chép JSON</button><span className="tnum text-xs text-slate-500">${fmtBytes(new Blob([text]).size)}</span>${msg ? html`<span className="text-xs text-emerald-300" role="status">${msg}</span>` : null}</div>
    </div><//>`;
}
function ImportModal({ onImport, onClose }) {
  const [text, setText] = useState('');
  const [err, setErr] = useState('');
  const onFile = e => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const r = new FileReader(); r.onload = () => { setText(String(r.result || '')); setErr(''); }; r.onerror = () => setErr('Không đọc được file. Thử chọn lại hoặc dán nội dung JSON.'); r.readAsText(file);
  };
  const go = () => {
    try { const obj = JSON.parse(text); if (!obj || typeof obj !== 'object' || !obj.checks) throw new Error('shape'); onImport(obj); }
    catch (e) { setErr(e.message === 'shape' ? 'JSON hợp lệ nhưng không phải file tiến độ của Study Hub (thiếu trường "checks").' : 'Nội dung không phải JSON hợp lệ. Kiểm tra lại file export.'); }
  };
  return html`<${Modal} title="Import JSON" onClose=${onClose} wide=${true}>
    <div className="flex flex-col gap-3">
      <p className="text-sm text-slate-400">Chọn file <code className="inl">sd-progress-*.json</code> hoặc dán nội dung. Toàn bộ tiến độ hiện tại sẽ được thay bằng dữ liệu trong file.</p>
      <label className="flex flex-col gap-1 text-xs text-slate-400" htmlFor="import-file">File JSON<input id="import-file" type="file" accept=".json,application/json" onChange=${onFile} className="text-sm text-slate-300 file:mr-3 file:rounded-md file:border-0 file:bg-slate-800 file:px-3 file:py-2 file:text-sm file:text-slate-100" /></label>
      <textarea id="import-json" rows="10" className=${inputCls + ' tnum text-xs'} placeholder='{"v":1,"checks":{…}}' value=${text} onChange=${e => { setText(e.target.value); setErr(''); }}></textarea>
      ${err ? html`<p className="text-sm text-rose-300" role="alert">${err}</p>` : null}
      <div className="flex justify-end gap-2"><button className=${B('ghost')} onClick=${onClose}>Huỷ</button><button className=${B('primary')} disabled=${!text.trim()} onClick=${go}><${Icon} n="upload" />Khôi phục</button></div>
    </div><//>`;
}
function ResetModal({ onReset, onClose }) {
  const [typed, setTyped] = useState('');
  return html`<${Modal} title="Reset progress" onClose=${onClose}>
    <div className="flex flex-col gap-3">

        ${NAV.map(n => html`<button key=${n.id} onClick=${() => go(n.id)} aria-current=${page === n.id ? 'page' : null}
          className=${`flex shrink-0 items-center gap-2.5 rounded-md px-3 py-2 text-sm transition-colors ${page === n.id ? 'bg-slate-800 text-slate-50' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'}`}>
          <${Icon} n=${n.icon} className=${page === n.id ? 'text-indigo-300' : ''} />${n.label}</button>`)}
      </nav>
      <div className="hidden lg:mt-auto lg:block lg:border-t lg:border-slate-800 lg:p-5">
        <div className="flex items-baseline justify-between"><${Eyebrow}>Tiến độ tổng<//><span className="tnum text-sm font-semibold text-slate-100">${Math.round(stats.pct * 100)}%</span></div>
        <div className="mt-2"><${Bar} value=${stats.pct} h="h-2" /></div>
        <div className="mt-4 flex flex-col gap-2">${PHASES.map(p => { const ps = stats.phase[p.id]; return html`<div key=${p.id} className="flex items-center gap-2"><span className="tnum w-6 text-[11px] text-slate-500">P${p.id}</span><div className="flex-1"><${Bar} value=${ps.total ? ps.done / ps.total : 0} cls=${KIND[p.kind].bar} h="h-1" /></div></div>`; })}</div>
        <div className="tnum mt-4 text-[11px] text-slate-500">${fmt(stats.hours, 0)} / 165 giờ · ${stats.done}/${stats.total} mục</div>
      </div>
      <div className="gutter pb-3 lg:hidden"><${Bar} value=${stats.pct} /></div>
    </aside>

    <div className="min-w-0">
      <header className="sticky z-40 border-b border-slate-800 bg-slate-950/90 backdrop-blur" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
        <div className="gutter mx-auto flex max-w-[1400px] items-center gap-3 py-3">
          <div className="flex min-w-0 items-center gap-2"><${Icon} n=${cur.icon} className="text-indigo-300" /><span className="truncate text-sm font-semibold text-slate-100">${cur.label}</span></div>
          <span className=${'hidden truncate text-xs md:inline ' + (saveState === 'error' ? 'text-rose-300' : 'text-slate-500')}>${saveLabel}</span>
          <div className="ml-auto flex items-center gap-1.5">
            <button className=${B('ghost') + ' px-2.5 py-1.5 text-xs'} onClick=${() => setModal('export')} title="Export JSON"><${Icon} n="download" s=${14} /><span className="hidden sm:inline">Export</span></button>
            <button className=${B('ghost') + ' px-2.5 py-1.5 text-xs'} onClick=${() => setModal('import')} title="Import JSON"><${Icon} n="upload" s=${14} /><span className="hidden sm:inline">Import</span></button>
            <button className=${B('ghost') + ' px-2.5 py-1.5 text-xs text-rose-300 hover:text-rose-200'} onClick=${() => setModal('reset')} title="Reset progress"><${Icon} n="reset" s=${14} /><span className="hidden sm:inline">Reset</span></button>
          </div>
        </div>
      </header>
      <main className="gutter mx-auto max-w-[1400px] pt-6 pb-16" style=${{ paddingBottom: 'calc(64px + env(safe-area-inset-bottom, 0px))' }}>
        <${body} S=${S} set=${set} stats=${stats} go=${go} />
      </main>
    </div>

    ${modal === 'export' ? html`<${ExportModal} S=${S} onClose=${() => setModal(null)} />` : null}
    ${modal === 'import' ? html`<${ImportModal} onClose=${() => setModal(null)} onImport=${obj => { setS(mergeState(obj)); setModal(null); flash('Đã khôi phục tiến độ từ JSON.'); }} />` : null}
    ${modal === 'reset' ? html`<${ResetModal} onClose=${() => setModal(null)} onReset=${() => { setS(mergeState(null)); setModal(null); flash('Đã xoá toàn bộ tiến độ.'); }} />` : null}
    ${toast ? html`<div role="status" className="fixed left-1/2 z-50 -translate-x-1/2 rounded-md border border-emerald-500/40 bg-slate-900 px-4 py-2 text-sm text-emerald-200 shadow-xl" style=${{ bottom: 'calc(20px + env(safe-area-inset-bottom, 0px))' }}>${toast}</div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
